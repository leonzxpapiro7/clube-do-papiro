<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clube do Papiro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#050506;--p1:#111214;--p2:#17181a;--ln:#26282b;--gold:#d9b13b;--yel:#ffc400;--tx:#eceae2;--mu:#8d8f93;--ok:#7fbf6a;--gr:linear-gradient(135deg,#7a5a0e,#f6df8a 38%,#c9971e 62%,#ffd84a);--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
body{min-height:100vh;background:linear-gradient(rgba(255,196,0,.045) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,196,0,.045) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px) 0 0/12px 12px,radial-gradient(900px 500px at 85% -10%,rgba(255,196,0,.08),transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3,.os{font-family:Oswald,Impact,"Arial Narrow",sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:0}
button{font:inherit;cursor:pointer;color:inherit;transition:filter .2s,background .2s,border-color .2s,color .2s}
.app{display:flex;min-height:100vh}
aside{width:244px;background:rgba(10,10,11,.92);border-right:1px solid var(--ln);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid var(--ln);margin-bottom:10px}
.logo img{width:48px;height:48px;border-radius:50%;flex:none;object-fit:cover;box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,196,0,.25)}
.logo b{display:block;font-size:16px;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{color:var(--mu);font:500 8.5px var(--mono);letter-spacing:.18em}
.sys{margin-top:auto;font:500 10px var(--mono);color:var(--mu);letter-spacing:.14em;padding:10px 8px;border-top:1px solid var(--ln)}.sys:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:8px;box-shadow:0 0 8px var(--ok)}
nav button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-left:3px solid transparent;padding:11px 12px;color:var(--mu);text-align:left;font:600 13px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase}
nav button:hover{color:var(--tx);background:rgba(255,255,255,.04)}
nav button.on{color:var(--yel);background:linear-gradient(90deg,rgba(255,196,0,.14),transparent);border-left-color:var(--yel)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:square;flex:none}
main{flex:1;padding:28px;max-width:1100px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--ln);position:relative}
.top:after{content:"";position:absolute;left:0;bottom:-1px;width:90px;height:2px;background:var(--yel)}
.top h1{font-size:28px}.top p{margin:2px 0 0;color:var(--mu);font:500 12px var(--mono);letter-spacing:.08em}
.card{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--ln);border-radius:3px;padding:18px;position:relative;transition:border-color .25s,box-shadow .25s}
.card:before,.card:after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
.card:before{left:-1px;top:-1px;border-left:2px solid var(--yel);border-top:2px solid var(--yel)}
.card:after{right:-1px;bottom:-1px;border-right:2px solid var(--yel);border-bottom:2px solid var(--yel)}
.card:hover{border-color:#4a4120;box-shadow:0 0 24px rgba(255,196,0,.06)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
h3{font-size:13px;color:var(--yel);margin-bottom:14px;display:flex;align-items:center;gap:8px}
h3:before{content:"";width:6px;height:6px;background:var(--yel);flex:none}
h3:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#4a4120,transparent)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.av{width:72px;height:72px;border-radius:50%;background:var(--gr);display:grid;place-items:center;color:#111;font:700 26px Oswald,sans-serif;border:3px solid #0a0a0a;box-shadow:0 0 0 2px var(--gold),0 0 20px rgba(255,196,0,.2);flex:none}
.av.s{width:40px;height:40px;font-size:15px;box-shadow:0 0 0 1px var(--gold)}
.rank{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 6px;border:1px solid var(--gold);color:var(--gold);background:rgba(217,177,59,.08);font:600 12px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.ins{width:20px;height:20px;fill:none;stroke-linecap:square}
.bar{position:relative;height:14px;background:#0a0a0b;border:1px solid var(--ln);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b88a00,#ffc400);box-shadow:0 0 12px rgba(255,196,0,.5);transition:width .7s}
.bar:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,#0a0a0b 9px 11px)}
.stat b{display:block;font:700 28px Oswald,sans-serif;color:var(--yel)}.stat span{color:var(--mu);font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.12em}
.btn{background:var(--yel);color:#0a0a0a;border:0;padding:10px 18px;font:700 13px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn.o{background:rgba(255,196,0,.04);color:var(--yel);box-shadow:inset 0 0 0 1px var(--yel)}.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:default}
.ms{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--ln);border-left:3px solid #4a4120;margin-bottom:10px;background:rgba(8,8,9,.7);border-radius:2px}
.ms.d{border-left-color:var(--ok);background:rgba(127,191,106,.07)}
.ms .t{flex:1}.ms .t small{color:var(--mu)}
.chk{width:26px;height:26px;border:2px solid var(--yel);background:none;color:#0a0a0a;font-weight:700;display:grid;place-items:center;flex:none;border-radius:2px}
.d .chk{background:var(--ok);border-color:var(--ok)}
.xp{color:var(--yel);font:700 13px var(--mono);letter-spacing:.06em}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-bottom:16px}
.pod .card{text-align:center;padding:18px 8px}.pod .p1{padding-bottom:34px;border-color:var(--gold);box-shadow:0 0 34px rgba(255,196,0,.12)}
.pod .av{margin:6px auto 8px}.pod .m{font:700 26px Oswald,sans-serif}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln)}
.row.me{background:rgba(255,196,0,.09);border-left:3px solid var(--yel)}.row .n{width:26px;font:700 14px var(--mono);color:var(--mu)}.row .t{flex:1}
.medal{text-align:center;padding:16px 8px;cursor:pointer}.medal svg{width:64px;height:64px;filter:drop-shadow(0 0 8px rgba(255,196,0,.3))}.medal.lk{filter:grayscale(1) brightness(.5)}
.medal h3{justify-content:center}.medal h3:before,.medal h3:after{display:none}
.medal small{display:block;color:var(--mu);font:500 11px var(--mono)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--p1);border:1px solid var(--ln);border-radius:2px;padding:8px 14px;color:var(--mu);font:600 12px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.tabs button.on{border-color:var(--yel);color:var(--yel);background:rgba(255,196,0,.08)}
.fc{min-height:170px;display:grid;place-items:center;text-align:center;font:500 20px Oswald,sans-serif;letter-spacing:.03em;cursor:pointer;padding:24px;border:1px dashed var(--gold);background:rgba(8,8,9,.7)}
.opt{display:block;width:100%;text-align:left;background:rgba(8,8,9,.7);border:1px solid var(--ln);border-radius:2px;padding:10px 12px;margin-bottom:8px}
.opt:hover{border-color:var(--yel)}.opt.ok{border-color:var(--ok);background:rgba(127,191,106,.1)}.opt.no{border-color:#b04444;background:rgba(176,68,68,.1)}
.cols{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:10px;background:repeating-linear-gradient(0deg,transparent 0 29px,rgba(255,255,255,.05) 29px 30px)}
.cols div{flex:1;text-align:center;font:500 11px var(--mono);color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cols i{display:block;background:linear-gradient(180deg,#ffc400,#8a6a00);min-height:3px;transition:height .7s;box-shadow:0 0 10px rgba(255,196,0,.3)}
.ring{width:130px;height:130px;margin:auto;position:relative}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 28px Oswald,sans-serif;color:var(--yel)}
input{background:rgba(8,8,9,.8);border:1px solid var(--ln);border-radius:2px;color:var(--tx);padding:10px 12px;font:inherit;width:100%}input:focus{outline:0;border-color:var(--yel)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--yel);color:#0a0a0a;padding:10px 18px;border-left:4px solid #0a0a0a;font:700 13px Oswald,sans-serif;letter-spacing:.08em;opacity:0;pointer-events:none;transition:.3s;z-index:50;text-align:center;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
#auth{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:16px;background:rgba(5,5,6,.95);overflow:auto}
#auth.on{display:grid}#auth .card{width:100%;max-width:400px}
#auth img{display:block;width:92px;height:92px;border-radius:50%;margin:0 auto 10px;box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(255,196,0,.3)}
#auth .lbl{font:500 10.5px var(--mono);color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin:12px 0 4px;display:block}
.lnk{background:none;border:0;color:var(--yel);padding:6px 0;font-size:13px;text-decoration:underline}
#amsg{margin-top:12px;font-size:13px;min-height:18px}
.mlogo{display:none}
@media(max-width:860px){
aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;border-right:0;border-top:1px solid var(--yel)}
aside .logo,.sys{display:none}nav{display:flex;overflow-x:auto;gap:4px;width:100%}
nav button{flex-direction:column;gap:3px;padding:6px 10px;font-size:10px;min-width:70px;align-items:center;text-align:center;border-left:0;border-top:2px solid transparent}
nav button.on{border-top-color:var(--yel);background:rgba(255,196,0,.1)}
.mlogo{display:block;width:54px;height:54px;border-radius:50%;margin-bottom:8px;box-shadow:0 0 0 2px var(--gold)}
main{padding:18px 14px 110px}.g2,.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
.top h1{font-size:22px}}
@media(max-width:520px){.g3{grid-template-columns:1fr}.pod{gap:6px}.pod .av{width:52px;height:52px;font-size:20px}}

/* === Atualização Clube do Papiro: acabamento e usabilidade === */
:root{--gold:#e2bd55;--yel:#ffd43b;--p1:#101114;--p2:#191a1e;--ln:#303136}
body{background-image:linear-gradient(rgba(255,212,59,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,212,59,.055) 1px,transparent 1px),radial-gradient(900px 500px at 85% -10%,rgba(255,196,0,.12),transparent 60%);background-size:40px 40px,40px 40px,auto}
aside{box-shadow:12px 0 36px rgba(0,0,0,.2)}
.card{border-radius:8px;background:linear-gradient(145deg,rgba(28,29,33,.98),rgba(13,14,16,.98));}
.btn,.tabs button,.opt,.ms,input,select{border-radius:6px}
.btn{min-height:42px}
.btn.o{border:1px solid rgba(255,212,59,.6);box-shadow:none}
.top{margin-bottom:24px}
.top h1{letter-spacing:.06em}
.stat b{font-size:30px}
.ms{border-radius:7px;padding:14px;background:rgba(255,255,255,.018)}
.ms.d{border-left-color:var(--ok)}
.opt{padding:13px 14px;line-height:1.45}
.opt:disabled{cursor:default;opacity:1}
.fc{border-radius:10px;min-height:190px;background:linear-gradient(145deg,#1a1b1e,#090a0b);font-size:clamp(17px,2vw,22px)}
select{background:#101114;border:1px solid var(--ln);color:var(--tx);padding:10px 12px;font:inherit;min-width:140px}
.muted{color:var(--mu)}
.kicker{font:600 10px var(--mono);letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.notice{border:1px solid rgba(255,196,0,.28);background:rgba(255,196,0,.055);padding:12px 14px;border-radius:7px;color:#d8d2bd}
.empty{padding:28px 18px;text-align:center;border:1px dashed #514522;border-radius:8px;color:var(--mu)}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 18px}
@media(max-width:860px){aside{box-shadow:0 -10px 30px rgba(0,0,0,.45)}nav button{min-width:66px}.card{padding:15px}}


.contest-badge{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid rgba(226,189,85,.42);border-radius:8px;background:linear-gradient(135deg,rgba(255,212,59,.08),rgba(10,10,12,.78));min-width:220px}
.contest-badge img{width:68px;height:68px;object-fit:contain;background:#f5f2e9;border-radius:7px;padding:4px;flex:none}
.contest-badge .crest-fallback{display:none;width:68px;height:68px;place-items:center;border:2px solid var(--gold);border-radius:50%;color:var(--yel);background:radial-gradient(circle,#28200b 0 48%,#090909 50%);font:700 17px Oswald,sans-serif;flex:none;box-shadow:inset 0 0 0 3px #111,0 0 12px rgba(255,196,0,.18)}
.contest-badge b{display:block;font:700 20px Oswald,sans-serif;color:var(--yel);letter-spacing:.08em}
.contest-badge small{display:block;color:var(--mu);font-size:11px;max-width:230px}
.contest-badge a{display:inline-block;color:var(--gold);font-size:10px;margin-top:4px;text-decoration:none}
.contest-badge.compact{min-width:0;padding:8px 10px}
.contest-badge.compact img,.contest-badge.compact .crest-fallback{width:44px;height:44px}
.empty-contest{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
#auth select,.profile-select{width:100%;margin-top:5px}

</style>
</head>

// ===== DADOS REAIS NO SUPABASE =====
var cloud={xp:0,history:[],missions:[],questions:[],achievements:[],loading:false,error:"",contest:"",discipline:"",year:"",questionIndex:0,questionAnswer:null,flashIndex:0,flashBack:false};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmtXP(v){return Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2})}
function levelIndex(x){var i=0;LV.forEach(function(v,k){if(Number(x)>=v[1])i=k});return i}
function questionOptions(q){
 var o=q.options;
 if(typeof o==="string"){try{o=JSON.parse(o)}catch(e){o=[]}}
 if(Array.isArray(o))return o;
 if(o&&typeof o==="object")return Object.keys(o).sort().map(function(k){return o[k]});
 return [];
}
function correctIndex(q){
 var a=q.correct_answer;
 if(a==null)return -1;
 if(typeof a==="number")return a>=1&&a<=4?a-1:a;
 var s=String(a).trim().toUpperCase();
 if(["A","B","C","D"].indexOf(s)>=0)return "ABCD".indexOf(s);
 var n=parseInt(s,10);return !isNaN(n)?(n>=1&&n<=4?n-1:n):-1;
}
async function syncCloudData(){
 if(!sb||!uid)return;
 cloud.loading=true;cloud.error="";
 try{
  var xr=await sb.from("xp_history").select("activity,xp_amount,created_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(500);
  if(xr.error)throw xr.error;
  cloud.history=xr.data||[];
  cloud.xp=cloud.history.reduce(function(s,x){return s+Number(x.xp_amount||0)},0);
  D.xp=cloud.xp;
  D.hist=cloud.history.map(function(x){return {t:x.activity||"Atividade",x:Number(x.xp_amount||0)}}).slice(0,30);
  var mr=await sb.from("user_missions").select("mission_key,completed_at").eq("user_id",uid);
  if(mr.error)throw mr.error;
  cloud.missions=mr.data||[];
  D.done=cloud.missions.map(function(x){return x.mission_key});
  var ar=await sb.from("user_achievements").select("achievement_key,unlocked_at").eq("user_id",uid);
  if(ar.error)throw ar.error;
  cloud.achievements=ar.data||[];
 }catch(e){cloud.error=e.message||"Não foi possível carregar o progresso";console.error("Supabase sync:",e)}
 finally{cloud.loading=false}
}
async function awardCloud(activity,reference){
 if(!sb||!uid){toast("Entre na sua conta para registrar o progresso.");return false}
 var r=await sb.rpc("award_activity_xp",{p_activity:activity,p_reference_id:String(reference)});
 if(r.error){console.error(r.error);toast("Não foi possível registrar XP: "+r.error.message);return false}
 await syncCloudData();return true;
}
async function loadQuestions(){
 if(!sb||!uid)return;
 cloud.loading=true;cloud.error="";render();
 try{
  var q=sb.from("questions").select("id,contest,contest_type,year,discipline,subject,question_number,statement,options,correct_answer,explanation,source_url").eq("active",true).eq("answer_key_verified",true);
  if(cloud.contest)q=q.eq("contest",cloud.contest);
  if(cloud.discipline)q=q.eq("discipline",cloud.discipline);
  if(cloud.year)q=q.eq("year",Number(cloud.year));
  var r=await q.order("year",{ascending:false}).order("question_number",{ascending:true}).limit(100);
  if(r.error)throw r.error;
  cloud.questions=r.data||[];cloud.questionIndex=0;cloud.questionAnswer=null;cloud.flashIndex=0;cloud.flashBack=false;
 }catch(e){cloud.error=e.message||"Erro ao carregar questões";cloud.questions=[]}
 finally{cloud.loading=false;render()}
}
function questionMeta(q){return [q.contest,q.contest_type,q.year,q.discipline,q.subject].filter(Boolean).join(" · ")}
function safeQuestionBody(q){return esc(q&&q.statement||"Enunciado não cadastrado")}
function questionEmpty(){return '<div class="empty"><div class="kicker">Banco de questões</div><h2 style="margin:8px 0;color:var(--tx)">Nenhuma questão disponível</h2><p>O banco ainda não possui questões ativas com gabarito verificado para esses filtros. Não exibiremos questões inventadas como se fossem de provas anteriores.</p></div>'}
function renderQuestionBank(){
 var q=cloud.questions[cloud.questionIndex],opts=q?questionOptions(q):[];
 var years=[...new Set(cloud.questions.map(function(x){return x.year}).filter(Boolean))];
 var h='<h3>Banco de questões verificadas</h3><div class="notice">Somente questões cadastradas no Supabase com <b>active = true</b> e <b>answer_key_verified = true</b> aparecem aqui.</div>';
 h+='<div class="filters"><select id="qcontest"><option value="">Todos os concursos</option>'+["EEAR","EAM","CFN","ESA"].map(function(x){return '<option '+(cloud.contest===x?'selected':'')+' value="'+x+'">'+x+'</option>'}).join("")+'</select><select id="qdisc"><option value="">Todas as disciplinas</option>'+[...new Set(cloud.questions.map(function(x){return x.discipline}).filter(Boolean))].sort().map(function(x){return '<option '+(cloud.discipline===x?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>'}).join("")+'</select><select id="qyear"><option value="">Todos os anos</option>'+years.map(function(x){return '<option '+(String(cloud.year)===String(x)?'selected':'')+' value="'+x+'">'+x+'</option>'}).join("")+'</select><button class="btn o" data-a="reloadq">Aplicar filtros</button></div>';
 if(cloud.loading)return h+'<div class="empty">Carregando questões verificadas…</div>';
 if(cloud.error)return h+'<div class="notice">Falha ao consultar o banco: '+esc(cloud.error)+'</div>';
 if(!q)return h+questionEmpty();
 h+='<div class="kicker">'+esc(questionMeta(q))+' · Questão '+esc(q.question_number||"—")+'</div><p style="font-size:18px;line-height:1.65;margin:14px 0">'+safeQuestionBody(q)+'</p>';
 h+=opts.map(function(o,k){var selected=cloud.questionAnswer!==null,ci=correctIndex(q),cls=selected&&k===ci?"ok":selected&&k===cloud.questionAnswer?"no":"";return '<button class="opt '+cls+'" '+(selected?'disabled':'')+' data-a="answerdb" data-p="'+k+'"><b>'+"ABCD"[k]+')</b> '+esc(o)+'</button>'}).join("");
 if(cloud.questionAnswer!==null){var ci=correctIndex(q);h+='<div class="notice" style="margin:12px 0"><b>'+ (cloud.questionAnswer===ci?'Resposta correta.':'Resposta registrada.')+'</b> '+esc(q.explanation||"Confira o gabarito oficial da prova.")+(q.source_url?' <a href="'+esc(q.source_url)+'" target="_blank" rel="noopener" style="color:var(--yel)">Fonte da prova/gabarito</a>':'')+'</div><button class="btn" data-a="nextdb">Próxima questão</button>'}
 h+='<p class="muted" style="font-size:12px;margin-top:14px">'+(cloud.questionIndex+1)+' de '+cloud.questions.length+' questões carregadas</p>';
 return h;
}
function renderFlashcardsDB(){
 var q=cloud.questions[cloud.flashIndex];
 if(cloud.loading)return '<div class="empty">Carregando cartões…</div>';
 if(!q)return '<h3>Flashcards de provas anteriores</h3>'+questionEmpty()+'<p class="muted">Os cartões usam o enunciado e o gabarito de questões reais cadastradas, sem criar perguntas fictícias.</p>';
 var opts=questionOptions(q),ci=correctIndex(q),back=ci>=0?("Gabarito: "+"ABCD"[ci]+") "+(opts[ci]||"")+(q.explanation?"\n\n"+q.explanation:"")):"Gabarito ainda não disponível";
 return '<h3>Revisão por questões anteriores</h3><div class="kicker">'+esc(questionMeta(q))+' · Questão '+esc(q.question_number||"—")+'</div><div class="fc" data-a="flipdb" style="white-space:pre-wrap">'+(cloud.flashBack?esc(back):safeQuestionBody(q))+'</div><p class="muted" style="text-align:center">Toque no cartão para revelar o gabarito</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn o" data-a="reviewdb" data-p="0">Errei / revisar novamente</button><button class="btn" data-a="reviewdb" data-p="1">Concluí revisão · +0,25 XP</button></div><p class="muted" style="text-align:center;font-size:12px">'+(cloud.flashIndex+1)+' de '+cloud.questions.length+'</p>';
}
function renderRealRanking(){
 return head("Ranking de Elite","Classificação coletiva com dados reais.")+'<div class="notice">O ranking coletivo ainda precisa de uma função segura no Supabase que publique apenas nome de exibição e XP agregado. Não exibiremos dados pessoais nem nomes fictícios.</div><div class="card" style="margin-top:16px"><h3>Seu desempenho</h3><div class="stat"><b>'+fmtXP(cloud.xp)+' XP</b><span>XP registrado na sua conta</span></div></div>';
}
function renderCloudMissions(){
 return head("Missões Diárias","Registre suas missões no banco de dados.")+'<div class="notice">Cada missão concluída concede 0,50 XP, uma única vez por chave de missão. Marque somente após cumprir a atividade.</div><div class="card" style="margin-top:16px">'+MS.map(function(m){var done=cloud.missions.some(function(x){return x.mission_key===m[0]});return '<div class="ms '+(done?'d':'')+'"><div class="t"><b>'+esc(m[1])+'</b><br><small>'+esc(m[2])+'</small></div><span class="xp">+0,50 XP</span><button class="btn '+(done?'o':'')+'" '+(done?'disabled':'')+' data-a="missiondb" data-p="'+m[0]+'">'+(done?'Concluída ✓':'Concluir')+'</button></div>'}).join("")+'</div>';
}
function renderCloudProfile(){
 return head("Perfil do Aluno","Ficha de serviço sincronizada.")+'<div class="grid g2"><div class="card"><h3>Informações pessoais</h3><div class="hero"><div class="av">'+ini(D.name)+'</div><div><span class="rank">'+LV[levelIndex(cloud.xp)][0]+'</span><br><small class="muted">'+fmtXP(cloud.xp)+' XP acumulados</small></div></div><p class="muted">'+esc(EM)+'</p><input id="nm" value="'+esc(D.name)+'" maxlength="24"><label class="lbl" for="ex">Concurso-alvo</label><select id="ex" class="profile-select">'+contestOptions(P.target_exam||"")+'</select><button class="btn" style="margin-top:10px" data-a="name">Salvar perfil</button><button class="btn o" style="margin:10px 0 0 8px" data-a="out">Sair</button></div><div class="card"><h3>Histórico de XP</h3>'+(cloud.history.slice(0,12).map(function(x){return '<div class="row"><div class="t">'+esc(x.activity)+'</div><span class="xp">+'+fmtXP(x.xp_amount)+'</span></div>'}).join("")||'<p class="muted">Nenhum XP registrado ainda.</p>')+'</div></div>';
}

 cloud.contest=document.getElementById("qcontest")?document.getElementById("qcontest").value:"";

 cloud.questionAnswer=Number(p);render();
 try{await sb.from("user_question_reviews").insert({user_id:uid,question_id:q.id})}catch(e){}

var sb=null,P={},uid=null,EM="",recovering=false,AM="login";
function clean(t){return String(t||"").replace(/[<>&"'`]/g,"").trim().slice(0,60)}
function say(t,ok){var e=document.getElementById("amsg");e.textContent=t||"";e.style.color=ok?"var(--ok)":"#e07a7a"}
function errPt(m){m=m||"";if(/Invalid login/i.test(m))return"E-mail ou senha incorretos.";if(/not confirmed/i.test(m))return"Confirme seu e-mail antes de entrar.";if(/already registered/i.test(m))return"Este e-mail já tem cadastro. Use Entrar.";if(/rate limit|seconds/i.test(m))return"Muitas tentativas. Aguarde um pouco.";if(/Password should/i.test(m))return"Senha fraca. Use 8 caracteres ou mais.";if(/valid email|invalid/i.test(m))return"Confira o e-mail digitado.";return"Não foi possível concluir: "+m}
function authView(m,msg){AM=m;var h="";
if(m=="signup")h+='<label class="lbl">Nome</label><input id="a_n" maxlength="24" autocomplete="nickname"><label class="lbl">Concurso que você está preparando</label><select id="a_exam">'+contestOptions("")+'</select>';
if(m!="new")h+='<label class="lbl">E-mail</label><input id="a_e" type="email" autocomplete="email">';
if(m!="forgot")h+='<label class="lbl">'+(m=="new"?"Nova senha":"Senha")+'</label><input id="a_p" type="password" autocomplete="'+(m=="login"?"current-password":"new-password")+'">';
h+='<button class="btn" style="width:100%;margin-top:16px" data-a="auth">'+{login:"Entrar",signup:"Criar conta",forgot:"Enviar link",new:"Salvar nova senha"}[m]+'</button><div style="display:flex;justify-content:space-between;margin-top:8px">'+(m=="login"?'<button class="lnk" data-a="am" data-p="signup">Criar conta</button><button class="lnk" data-a="am" data-p="forgot">Esqueci a senha</button>':m=="new"?'':'<button class="lnk" data-a="am" data-p="login">Voltar ao login</button>')+'</div>';
document.getElementById("aform").innerHTML=h;say(msg);document.getElementById("alg").src=LOGO;document.getElementById("auth").className="on"}
A.auth=async function(){if(!sb)return;var g=function(i){var e=document.getElementById(i);return e?e.value.trim():""},em=g("a_e"),pe=document.getElementById("a_p"),pw=pe?pe.value:"",r,BASE=location.origin+location.pathname;
if(AM!="forgot"&&pw.length<8&&AM!="login")return say("A senha precisa ter 8 caracteres ou mais.");
say("Aguarde...",1);
try{
if(AM=="login")r=await sb.auth.signInWithPassword({email:em,password:pw});
else if(AM=="signup"){var n=clean(g("a_n"));if(n.length<2)return say("Digite seu nome (mínimo 2 letras).");var target=document.getElementById("a_exam")?document.getElementById("a_exam").value:"";if(!target)return say("Selecione o concurso que está preparando.");r=await sb.auth.signUp({email:em,password:pw,options:{data:{display_name:n,target_exam:target},emailRedirectTo:BASE}});if(!r.error&&!r.data.session)return say("Conta criada! Abra o e-mail que enviamos e confirme o cadastro para entrar.",1);if(!r.error&&r.data.session){var pr=await sb.from("profiles").update({target_exam:target}).eq("id",r.data.user.id);if(pr.error)console.warn("Não foi possível salvar o concurso no perfil:",pr.error.message)}}
else if(AM=="forgot"){r=await sb.auth.resetPasswordForEmail(em,{redirectTo:BASE});if(!r.error)return say("Se o e-mail existir, enviamos o link para criar uma nova senha.",1)}
else{r=await sb.auth.updateUser({password:pw});if(!r.error){recovering=false;toast("Senha alterada!");return enter(r.data.user)}}
if(r&&r.error)say(errPt(r.error.message))
}catch(x){say("Erro de conexão. Tente novamente.")}};

else if(ev=="SIGNED_OUT"||ev=="INITIAL_SESSION"){uid=null;authView("login")}})}
boot();
